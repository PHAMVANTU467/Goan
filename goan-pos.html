<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAN — Bán hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Theme màu mới đồng bộ: #33CCFF -> #99FFFF kết hợp Xanh dương & Trắng */
    --cyan-primary: #33CCFF;
    --cyan-light: #99FFFF;
    --cyan-soft: #e5faff;
    --cyan-bg: #f0fdff;
    --blue-500: #0088ff;
    --blue-600: #0077e6;
    --blue-700: #005bb5;
    --blue-800: #00458a;
    --blue-900: #022b59;
    --ink-900: #0f172a;
    --ink-700: #334155;
    --ink-600: #475569;
    --ink-400: #94a3b8;
    --line: #dce8f3;
    --white: #ffffff;
    --danger: #ef4444;
    --sidebar-w: 220px;
    --sidebar-w-collapsed: 76px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    font-family:'Inter', sans-serif;
    color:var(--ink-900);
    background:#f4faff;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .app{
    display:grid;
    grid-template-columns:var(--sidebar-w) 1fr;
    height:100vh;
    transition:grid-template-columns .18s ease;
  }
  .app.collapsed{ grid-template-columns:var(--sidebar-w-collapsed) 1fr; }

  /* ============= SIDEBAR (XANH DƯƠNG CAO CẤP) ============= */
  .sidebar{
    background:linear-gradient(180deg, #005bb5 0%, #003d80 100%);
    color:var(--white);
    display:flex;
    flex-direction:column;
    padding:16px 12px 14px;
    overflow-y:auto;
    z-index:10;
    box-shadow:2px 0 12px rgba(0, 60, 130, 0.1);
  }
  .sb-brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 8px 18px;
    cursor:pointer;
  }
  .sb-logo{
    width:32px; height:32px; border-radius:9px; flex:none;
    background:linear-gradient(135deg, var(--cyan-light), var(--cyan-primary));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(51, 204, 255, 0.35);
  }
  .sb-logo svg{ width:18px; height:18px; fill:#003d80; }
  .sb-word{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.4px;
    white-space:nowrap;
    overflow:hidden;
    color:#ffffff;
  }
  .app.collapsed .sb-word{ display:none; }

  .nav-list{ list-style:none; display:flex; flex-direction:column; gap:4px; flex:1; }

  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:10px;
    color:#cde8ff;
    font-size:13.5px;
    font-weight:500;
    cursor:grab;
    user-select:none;
    transition:background .12s ease, color .12s ease;
    white-space:nowrap;
  }
  .nav-item svg{ flex:none; width:19px; height:19px; }
  .nav-item span.label{ overflow:hidden; text-overflow:ellipsis; }
  .app.collapsed .nav-item{ justify-content:center; padding:12px 4px; }
  .app.collapsed .nav-item span.label{ display:none; }

  .nav-item:hover{ background:rgba(255,255,255,0.12); color:#ffffff; }
  .nav-item.active{
    background:rgba(255,255,255,0.2);
    color:#ffffff;
    box-shadow:inset 3px 0 0 var(--cyan-primary);
    font-weight:600;
  }
  .nav-item.active svg{ color:var(--cyan-light); }
  .nav-item.drag-over{ box-shadow:inset 0 2px 0 var(--cyan-primary); }
  .nav-item.dragging{ opacity:0.4; }

  /* SIDEBAR FOOTER (USER & LOGOUT) */
  .sb-foot{
    border-top:1px solid rgba(255,255,255,0.15);
    padding-top:10px;
    margin-top:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .sb-user-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    background:rgba(255,255,255,0.1);
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.12);
  }
  .sb-avatar{
    width:32px;
    height:32px;
    border-radius:8px;
    background:linear-gradient(135deg, var(--cyan-primary), var(--cyan-light));
    color:var(--blue-900);
    font-weight:700;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    font-family:'Space Grotesk', sans-serif;
  }
  .sb-user-info{
    overflow:hidden;
    min-width:0;
    flex:1;
  }
  .sb-name{
    font-size:12.5px;
    font-weight:600;
    color:var(--white);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .sb-role{
    font-size:11px;
    color:var(--cyan-light);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .app.collapsed .sb-user-card{
    justify-content:center;
    padding:8px 0;
  }
  .app.collapsed .sb-user-info{ display:none; }

  .sb-logout-btn{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 12px;
    border-radius:9px;
    color:#ffb8b8;
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
    background:none;
    border:none;
    width:100%;
    transition:background .12s ease, color .12s ease;
  }
  .sb-logout-btn:hover{
    background:rgba(239, 68, 68, 0.22);
    color:#ffffff;
  }
  .sb-logout-btn svg{
    flex:none;
    width:17px;
    height:17px;
  }
  .app.collapsed .sb-logout-btn{
    justify-content:center;
    padding:10px 4px;
  }
  .app.collapsed .sb-logout-btn span{ display:none; }

  .sb-collapse-btn{
    display:flex; align-items:center; gap:10px;
    padding:8px 12px; border-radius:9px;
    color:#b9dcfa; font-size:12.5px; cursor:pointer;
    background:none; border:none; width:100%;
    transition:color .12s ease;
  }
  .sb-collapse-btn:hover{ background:rgba(255,255,255,0.08); color:#fff; }
  .sb-collapse-btn svg{ flex:none; width:17px; height:17px; transition:transform .18s ease; }
  .app.collapsed .sb-collapse-btn svg{ transform:rotate(180deg); }
  .app.collapsed .sb-collapse-btn span{ display:none; }

  /* ============= MAIN ============= */
  .main{ overflow-y:auto; height:100vh; background:#f4faff; }

  .page{ display:none; height:100%; flex-direction:column; }
  .page.active{ display:flex; }

  /* PAGE HEADER */
  .page-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 24px;
    background:var(--white);
    border-bottom:1.5px solid var(--line);
    flex-wrap:wrap;
    gap:12px;
    box-shadow:0 2px 8px rgba(0, 80, 160, 0.03);
  }
  .page-title{
    display:flex; align-items:center; gap:10px;
  }
  .page-title h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:19px;
    font-weight:700;
    color:var(--blue-900);
  }
  .page-title svg{ color:var(--blue-600); width:21px; height:21px; }

  /* SEGMENTED TOGGLE (BÁN THƯỜNG / BÁN NHANH) */
  .segmented{
    display:flex;
    background:#e6f7ff;
    border:1px solid #c8edff;
    border-radius:10px;
    padding:3px;
    gap:3px;
  }
  .segmented button{
    border:none; background:transparent; cursor:pointer;
    padding:7px 18px; border-radius:8px;
    font-size:13px; font-weight:600;
    color:var(--blue-700);
    font-family:'Inter', sans-serif;
    transition:all .15s ease;
  }
  .segmented button.active{
    background:var(--blue-600);
    color:#fff;
    box-shadow:0 3px 10px rgba(0, 119, 230, 0.25);
  }

  /* HEADER USER BADGE & LOGOUT */
  .hdr-user{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .hdr-badge{
    display:flex;
    align-items:center;
    gap:8px;
    background:#e6f7ff;
    border:1px solid #cceeff;
    padding:6px 14px;
    border-radius:100px;
    font-size:12.5px;
  }
  .hdr-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#10b981;
    box-shadow:0 0 0 2px rgba(16,185,129,0.25);
  }
  .hdr-name{
    font-weight:600;
    color:var(--blue-900);
  }
  .hdr-shop{
    color:var(--blue-600);
    font-size:11.5px;
    border-left:1px solid #bce4fa;
    padding-left:8px;
  }
  .btn-hdr-logout{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:8px;
    border:1px solid #fed7d7;
    background:var(--white);
    color:var(--danger);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s ease;
    font-family:'Inter', sans-serif;
  }
  .btn-hdr-logout:hover{
    border-color:var(--danger);
    background:#fef2f2;
  }
  .btn-hdr-logout svg{ width:15px; height:15px; }

  /* ============= PLACEHOLDER PAGES ============= */
  .placeholder-body{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    gap:12px;
    color:var(--ink-400);
    padding:40px;
  }
  .placeholder-body .ph-icon{
    width:64px; height:64px;
    border-radius:18px;
    background:#e6f7ff;
    display:flex; align-items:center; justify-content:center;
  }
  .placeholder-body .ph-icon svg{ width:32px; height:32px; color:var(--blue-600); }
  .placeholder-body p{ font-size:14px; max-width:36ch; text-align:center; line-height:1.6; }
  .placeholder-body strong{ color:var(--blue-900); font-size:16px; font-family:'Space Grotesk', sans-serif; }

  /* ============= SALES VIEWS ============= */
  .sales-body{ flex:1; overflow:hidden; }
  .sales-view{ display:none; height:100%; }
  .sales-view.active{ display:flex; }

  .catalog-panel{
    display:flex; flex-direction:column;
    padding:16px 20px;
    overflow:hidden;
    flex:1;
    min-width:0;
  }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:9px 14px;
    margin-bottom:12px;
    transition:all .15s ease;
  }
  .search-box:focus-within{
    border-color:var(--cyan-primary);
    box-shadow:0 0 0 3px rgba(51, 204, 255, 0.2);
  }
  .search-box svg{ flex:none; width:17px; height:17px; color:var(--blue-600); }
  .search-box input{
    border:none; outline:none; flex:1; font-size:14px; font-family:'Inter',sans-serif;
    background:transparent;
  }

  .cat-tabs{
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:12px; margin-bottom:6px;
    scrollbar-width:thin;
  }
  .cat-tab{
    flex:none;
    padding:7px 16px;
    border-radius:100px;
    font-size:13px; font-weight:600;
    background:var(--white);
    border:1.5px solid var(--line);
    color:var(--ink-700);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .cat-tab.active{
    background:var(--blue-600);
    border-color:var(--blue-600);
    color:#fff;
    box-shadow:0 3px 10px rgba(0, 119, 230, 0.22);
  }
  .cat-tab:hover:not(.active){
    border-color:var(--cyan-primary);
    color:var(--blue-700);
    background:#f0fbff;
  }

  /* ============= PRODUCT GRID & CARDS (SỬA LỖI KÍCH THƯỚC CHUẨN ĐẸP) ============= */
  .product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(148px, 1fr));
    gap:14px;
    overflow-y:auto;
    padding:4px 2px 20px;
    flex:1;
    align-content:start;
  }

  .prod-card{
    background:var(--white);
    border:1.5px solid #dce8f3;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    height:224px; /* Chiều cao cố định đồng đều, không bị nhảy kích thước */
    box-shadow:0 2px 8px rgba(0, 80, 160, 0.04);
  }
  .prod-card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 22px rgba(0, 119, 230, 0.16);
    border-color:var(--cyan-primary);
  }

  .prod-img{
    position:relative;
    width:100%;
    height:136px;
    min-height:136px;
    max-height:136px;
    background:#f0faff;
    overflow:hidden;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .prod-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    transition:transform .2s ease;
  }
  .prod-card:hover .prod-img img{
    transform:scale(1.04);
  }

  .prod-ph{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--blue-600), var(--cyan-primary));
    color:#fff;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:22px;
  }
  .prod-price{
    position:absolute; left:6px; bottom:6px;
    background:rgba(2, 43, 89, 0.88);
    backdrop-filter:blur(4px);
    color:var(--cyan-light);
    font-size:11.5px; font-weight:700;
    padding:3px 8px; border-radius:6px;
    font-family:'Space Grotesk', sans-serif;
    letter-spacing:0.2px;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  .prod-info{
    padding:8px 10px 10px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    flex:1;
  }
  .prod-name{
    font-size:12.8px; font-weight:600; line-height:1.35;
    color:var(--ink-900);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    height:2.7em;
  }
  .prod-unit{ font-size:11px; color:var(--ink-400); margin-top:2px; }

  /* ============= CART PANEL (TÔNG TRẮNG & XANH DƯƠNG) ============= */
  .cart-panel{
    width:380px;
    flex:none;
    background:var(--white);
    border-left:1.5px solid var(--line);
    display:flex; flex-direction:column;
    min-width:300px;
    box-shadow:-2px 0 12px rgba(0, 80, 160, 0.03);
  }
  .cart-top{
    padding:14px 18px;
    border-bottom:1.5px solid var(--line);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .table-chip{
    display:flex; align-items:center; gap:6px;
    background:#e6f7ff; color:var(--blue-800);
    font-weight:700; font-size:13px;
    padding:7px 14px; border-radius:8px;
    cursor:pointer; border:1px solid #c8edff;
    font-family:'Inter', sans-serif;
  }
  .table-chip svg{ width:15px; height:15px; color:var(--blue-600); }
  .cust-search{
    flex:1; min-width:120px;
    display:flex; align-items:center; gap:6px;
    border:1.5px solid var(--line); border-radius:8px;
    padding:7px 10px;
  }
  .cust-search:focus-within{ border-color:var(--cyan-primary); }
  .cust-search svg{ width:15px; height:15px; color:var(--blue-600); flex:none; }
  .cust-search input{ border:none; outline:none; flex:1; font-size:12.5px; background:transparent; }

  .cart-list{
    flex:1; overflow-y:auto;
    padding:8px 14px;
  }
  .cart-empty{
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:var(--ink-400); text-align:center; padding:30px;
  }
  .cart-empty svg{ width:46px; height:46px; color:#b5e2fa; }
  .cart-empty p{ font-size:13px; max-width:22ch; }

  .cart-line{
    display:flex; gap:10px; align-items:flex-start;
    padding:10px 0;
    border-bottom:1px solid #edf4fa;
  }
  .cart-thumb{
    width:46px; height:46px; border-radius:8px; flex:none; overflow:hidden;
    background:#f0f9ff; border:1px solid #dce8f3;
  }
  .cart-thumb img{ width:100%; height:100%; object-fit:cover; }
  .cart-thumb .ph{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--blue-600), var(--cyan-primary));
    color:#fff; font-size:13px; font-weight:700; font-family:'Space Grotesk',sans-serif;
  }
  .cart-mid{ flex:1; min-width:0; }
  .cart-mid .cn{ font-size:12.8px; font-weight:600; line-height:1.3; color:var(--ink-900); }
  .cart-mid .cp{ font-size:11.8px; color:var(--blue-700); font-weight:600; margin:2px 0 4px; }
  .qty-stepper{
    display:inline-flex; align-items:center;
    border:1px solid var(--line); border-radius:6px; overflow:hidden;
  }
  .qty-stepper button{
    border:none; background:#f4faff; width:22px; height:22px;
    cursor:pointer; font-weight:700; font-size:13px; color:var(--blue-800);
  }
  .qty-stepper button:hover{ background:#e0f3ff; }
  .qty-stepper .q{ width:26px; text-align:center; font-size:12px; font-weight:600; }

  .cart-right{
    display:flex; flex-direction:column; align-items:flex-end; gap:6px;
  }
  .cart-right .lt{ font-size:12.8px; font-weight:700; color:var(--blue-900); font-family:'Space Grotesk',sans-serif; }
  .rm-btn{
    background:none; border:none; cursor:pointer; color:var(--ink-400); padding:2px;
  }
  .rm-btn:hover{ color:var(--danger); }
  .rm-btn svg{ width:14px; height:14px; }

  /* CART SUMMARY & ACTIONS */
  .cart-summary{
    padding:12px 18px 16px;
    border-top:1.5px solid var(--line);
    background:#ffffff;
  }
  .sum-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; color:var(--ink-600); margin-bottom:6px;
  }
  .sum-row .mini{
    width:64px; text-align:right; border:1px solid var(--line); border-radius:6px;
    padding:4px 6px; font-size:12.5px; font-family:'Inter',sans-serif;
  }
  .sum-total{
    display:flex; align-items:center; justify-content:space-between;
    background:#e8f8ff;
    border:1px solid #c8edff;
    border-radius:10px;
    padding:11px 14px;
    margin:10px 0 12px;
    font-weight:700;
  }
  .sum-total .label{ font-size:13px; color:var(--blue-800); }
  .sum-total .value{ font-family:'Space Grotesk',sans-serif; font-size:19px; color:var(--blue-900); }

  .note-input{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font-size:12.5px; font-family:'Inter',sans-serif;
    margin-bottom:12px; outline:none;
  }
  .note-input:focus{ border-color:var(--cyan-primary); }

  .action-row{ display:flex; gap:8px; }
  .btn-outline{
    flex:1; border:1.5px solid var(--line); background:var(--white);
    border-radius:8px; padding:11px; font-size:13px; font-weight:600;
    color:var(--ink-700); cursor:pointer; font-family:'Inter',sans-serif;
    transition:all .15s ease;
  }
  .btn-outline:hover{ border-color:var(--blue-500); color:var(--blue-700); background:#f4faff; }
  .btn-pay{
    flex:2; border:none;
    background:linear-gradient(135deg, #0077e6 0%, #0099ff 100%);
    border-radius:8px; padding:11px; font-size:14px; font-weight:700;
    color:var(--white); cursor:pointer; font-family:'Inter',sans-serif;
    box-shadow:0 4px 12px rgba(0, 119, 230, 0.3);
    transition:all .15s ease;
  }
  .btn-pay:hover{
    background:linear-gradient(135deg, #0066cc 0%, #0088ee 100%);
    box-shadow:0 6px 16px rgba(0, 119, 230, 0.4);
  }

  /* Bán nhanh: cart on the left, catalog on right */
  #view-nhanh{ flex-direction:row-reverse; }
  #view-nhanh .cart-panel{ border-left:none; border-right:1.5px solid var(--line); }

  /* ============= RESPONSIVE ============= */
  @media (max-width: 1180px){
    .app{ grid-template-columns: var(--sidebar-w-collapsed) 1fr; }
    .sidebar .sb-word{ display:none; }
    .nav-item{ justify-content:center; padding:12px 4px; }
    .nav-item span.label{ display:none; }
    .sb-collapse-btn{ display:none; }
  }

  @media (max-width: 880px){
    .sales-view{ flex-direction:column; }
    #view-nhanh{ flex-direction:column-reverse; }
    .cart-panel{ width:100%; min-width:0; border:none !important; border-top:1.5px solid var(--line) !important; max-height:46vh; }
    .catalog-panel{ max-height:54vh; }
  }

  @media (max-width: 620px){
    .app{ grid-template-columns:1fr; grid-template-rows:1fr auto; }
    .sidebar{
      order:2; flex-direction:row; align-items:center; padding:8px 6px;

};

let activeNav = 'banhang';
let draggedKey = null;

function renderNav(){
  const ul = document.getElementById('navList');
  ul.innerHTML = '';
  NAV_ITEMS.forEach(item => {
    const li = document.createElement('li');
    li.className = 'nav-item' + (item.key === activeNav ? ' active' : '');
    li.draggable = true;
    li.dataset.key = item.key;
    li.innerHTML = ICONS[item.key] + `<span class="label">${item.label}</span>`;

    li.addEventListener('click', () => switchPage(item.key));

    li.addEventListener('dragstart', (e) => {
      draggedKey = item.key;
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    li.addEventListener('dragend', () => {
      li.classList.remove('dragging');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('drag-over'));
    });
    li.addEventListener('dragover', (e) => { e.preventDefault(); li.classList.add('drag-over'); });
    li.addEventListener('dragleave', () => li.classList.remove('drag-over'));
    li.addEventListener('drop', (e) => {
      e.preventDefault();
      li.classList.remove('drag-over');
      if(!draggedKey || draggedKey === item.key) return;
      const from = NAV_ITEMS.findIndex(n => n.key === draggedKey);
      const to = NAV_ITEMS.findIndex(n => n.key === item.key);
      const [moved] = NAV_ITEMS.splice(from, 1);
      NAV_ITEMS.splice(to, 0, moved);
      renderNav();
    });

    ul.appendChild(li);
  });
}

function switchPage(key){
  activeNav = key;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + key).classList.add('active');
  renderNav();
  if(key !== 'banhang' && !document.getElementById('page-' + key).dataset.built){
    buildPlaceholder(key);
  }
}

function buildPlaceholder(key){
  const [title, desc] = PLACEHOLDER_TEXT[key];
  const page = document.getElementById('page-' + key);
  page.dataset.built = '1';
  let userName = 'Chủ quán Demo';
  let userShop = 'GOAN Coffee & Tea';
  try {
    const raw = localStorage.getItem('goan_user');
    if(raw){
      const u = JSON.parse(raw);
      if(u.name) userName = u.name;
      if(u.shop) userShop = u.shop;
    }
  } catch(e){}

  page.innerHTML = `
    <div class="page-header">
      <div class="page-title">${ICONS[key]}<h1>${title}</h1></div>
      <div class="hdr-user">
        <div class="hdr-badge">
          <span class="hdr-dot"></span>
          <span class="hdr-name">${userName}</span>
          <span class="hdr-shop">${userShop}</span>

          <svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Đăng xuất</span>
        </button>
      </div>
    </div>
    <div class="placeholder-body">
      <div class="ph-icon">${ICONS[key]}</div>
      <strong>${title}</strong>
      <p>${desc} Tính năng này đang được xây dựng.</p>
    </div>`;
}

function fmtVND(n){ return n.toLocaleString('vi-VN') + 'đ'; }
function initials(name){
  return name.trim().split(/\s+/).slice(0,1)[0].slice(0,2).toUpperCase();
}

function renderCatTabs(mode){
  const el = document.querySelector(`[data-cattabs="${mode}"]`);
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="cat-tab${state.activeCat[mode]===c?' active':''}" data-cat="${c}">${c}</button>`
  ).join('');
  el.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeCat[mode] = btn.dataset.cat;
      renderCatTabs(mode);
      renderGrid(mode);
    });
  });
}

    (cat === 'Tất cả' || p.cat === cat) &&

  );
  
  el.innerHTML = list.map(p => `
    <div class="prod-card" data-code="${p.code}">
      <div class="prod-img">
        ${p.img 
          ? `<img src="assets/products/${p.img}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'prod-ph\\'>${initials(p.name)}</div><span class=\\'prod-price\\'>${fmtVND(p.price)}</span>';">` 
          : `<div class="prod-ph">${initials(p.name)}</div>`
        }
        <span class="prod-price">${fmtVND(p.price)}</span>
      </div>
      <div class="prod-info">
        <div class="prod-name" title="${p.name}">${p.name}</div>
        <div class="prod-unit">${p.unit}</div>
      </div>
    </div>`).join('') || `<div style="grid-column:1/-1; text-align:center; color:var(--ink-400); padding:40px 0; font-size:13.5px;">Không tìm thấy sản phẩm phù hợp.</div>`;

  el.querySelectorAll('.prod-card').forEach(card => {
    card.addEventListener('click', () => addToCart(card.dataset.code));
  });
}

function addToCart(code){
  const p = PRODUCTS.find(x => x.code === code);
  const line = state.cart.find(x => x.code === code);
  if(line){ line.qty += 1; } else { state.cart.push({...p, qty:1}); }
  renderCart('thuong');
  renderCart('nhanh');
}

function changeQty(code, delta){
  const line = state.cart.find(x => x.code === code);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0){ state.cart = state.cart.filter(x => x.code !== code); }
  renderCart('thuong');
  renderCart('nhanh');
}

function removeLine(code){
  state.cart = state.cart.filter(x => x.code !== code);
  renderCart('thuong');
  renderCart('nhanh');
}

function renderCart(mode){
  const listEl = document.querySelector(`[data-cartlist="${mode}"]`);
  const totalEl = document.querySelector(`[data-total="${mode}"]`);
  const total = state.cart.reduce((s, l) => s + l.price * l.qty, 0);
  totalEl.textContent = fmtVND(total);

  if(state.cart.length === 0){
    listEl.innerHTML = `
      <div class="cart-empty">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 8H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="21" r="1.3" fill="currentColor"/><circle cx="18" cy="21" r="1.3" fill="currentColor"/></svg>
        <p>Chưa có sản phẩm trong giỏ hàng. Chọn sản phẩm bên cạnh để thêm vào đơn.</p>
      </div>`;
    return;
  }

  listEl.innerHTML = state.cart.map(l => `
    <div class="cart-line" data-code="${l.code}">
      <div class="cart-thumb">
        ${l.img 
          ? `<img src="assets/products/${l.img}" alt="" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'ph\\'>${initials(l.name)}</div>';">` 
          : `<div class="ph">${initials(l.name)}</div>`
        }
      </div>
      <div class="cart-mid">
        <div class="cn">${l.name}</div>
        <div class="cp">${fmtVND(l.price)} / ${l.unit}</div>
        <div class="qty-stepper">
          <button data-act="dec">−</button>
          <span class="q">${l.qty}</span>
          <button data-act="inc">+</button>
        </div>
      </div>
      <div class="cart-right">
        <span class="lt">${fmtVND(l.price * l.qty)}</span>
        <button class="rm-btn" data-act="rm"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
    </div>`).join('');

  listEl.querySelectorAll('.cart-line').forEach(row => {
    const code = row.dataset.code;
    row.querySelector('[data-act="inc"]').addEventListener('click', () => changeQty(code, 1));
    row.querySelector('[data-act="dec"]').addEventListener('click', () => changeQty(code, -1));
    row.querySelector('[data-act="rm"]').addEventListener('click', () => removeLine(code));
  });
}

document.querySelector('[data-search="thuong"]').addEventListener('input', (e) => {
  state.search.thuong = e.target.value; renderGrid('thuong');
});
document.querySelector('[data-search="nhanh"]').addEventListener('input', (e) => {
  state.search.nhanh = e.target.value; renderGrid('nhanh');
});

renderCatTabs('thuong'); renderCatTabs('nhanh');
renderGrid('thuong'); renderGrid('nhanh');
renderCart('thuong'); renderCart('nhanh');

/* ============================================================
   AUTH & USER SESSION
   ============================================================ */
function initUserSession(){
  let user = null;
  try {
    const raw = localStorage.getItem('goan_user');
    if(raw) user = JSON.parse(raw);
  } catch(e){}

  if(!user){
    user = {
      email: 'demo@goan.vn',
      name: 'Chủ quán Demo',
      role: 'Quản lý cửa hàng',
      shop: 'GOAN Coffee & Tea (Chi nhánh 1)'
    };
    try {
      localStorage.setItem('goan_user', JSON.stringify(user));
    } catch(e){}
  }

  const hdrName = document.getElementById('hdrUserName');
  const hdrShop = document.getElementById('hdrUserShop');
  const sbName = document.getElementById('sbUserName');
  const sbRole = document.getElementById('sbUserRole');
  const sbAvatar = document.getElementById('sbAvatar');

  if(hdrName) hdrName.textContent = user.name || 'Chủ quán Demo';
  if(hdrShop) hdrShop.textContent = user.shop || 'GOAN Coffee & Tea';
  if(sbName) sbName.textContent = user.name || 'Chủ quán Demo';
  if(sbRole) sbRole.textContent = user.role || 'Quản lý cửa hàng';
  if(sbAvatar){
    const initial = (user.name || 'D').trim().charAt(0).toUpperCase();
    sbAvatar.textContent = initial;
  }
}

function handleLogout(){
  if(confirm('Bạn có chắc chắn muốn đăng xuất khỏi hệ thống GOAN POS?')){
    try {
      localStorage.removeItem('goan_user');
    } catch(e){}
    window.location.href = 'goan-login.html?logout=true';
  }
}

const hdrLogoutBtn = document.getElementById('hdrLogoutBtn');
if(hdrLogoutBtn) hdrLogoutBtn.addEventListener('click', handleLogout);

const sbLogoutBtn = document.getElementById('sbLogoutBtn');
if(sbLogoutBtn) sbLogoutBtn.addEventListener('click', handleLogout);

initUserSession();
</script>
