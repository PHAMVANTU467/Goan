<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOAN — Bán hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Bảng màu đồng bộ: #33CCFF -> #99FFFF kết hợp Xanh dương & Trắng */
    --cyan-primary: #33CCFF;
    --cyan-light: #99FFFF;
    --cyan-soft: #e5faff;
    --cyan-bg: #f0fdff;
    --blue-500: #0088ff;
    --blue-600: #0077e6;
    --blue-700: #005bb5;
    --blue-800: #00458a;
    --blue-900: #022b59;
    --ink-900: #0f172a;
    --ink-700: #334155;
    --ink-600: #475569;
    --ink-400: #94a3b8;
    --line: #dce8f3;
    --white: #ffffff;
    --danger: #ef4444;
    --topbar-h: 58px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    font-family:'Inter', sans-serif;
    color:var(--ink-900);
    background:#f4faff;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ============= THANH ĐIỀU HƯỚNG NGANG TRÊN CÙNG (TOPBAR) ============= */
  .topbar{
    height:var(--topbar-h);
    background:linear-gradient(90deg, #005bb5 0%, #0070d8 50%, #00458a 100%);
    color:var(--white);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    box-shadow:0 3px 12px rgba(0, 60, 130, 0.15);
    z-index:100;
    flex:none;
    gap:16px;
  }

  .top-left{
    display:flex;
    align-items:center;
    gap:20px;
    flex:1;
    min-width:0;
  }

  /* BRAND LOGO */
  .top-brand{
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    flex:none;
  }
  .top-logo{
    width:32px; height:32px; border-radius:9px; flex:none;
    background:linear-gradient(135deg, var(--cyan-light), var(--cyan-primary));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 8px rgba(51, 204, 255, 0.35);
  }
  .top-logo svg{ width:18px; height:18px; fill:#003d80; }
  .top-brand-text{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.5px;
    white-space:nowrap;
    color:#ffffff;
  }

  /* THANH ĐIỀU HƯỚNG NGANG */
  .top-nav{
    display:flex;
    align-items:center;
    gap:6px;
    list-style:none;
    overflow-x:auto;
    scrollbar-width:none;
    padding:2px 0;
  }
  .top-nav::-webkit-scrollbar{ display:none; }

  .nav-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 14px;
    border-radius:8px;
    color:#d0ebff;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
    white-space:nowrap;
    flex:none;
  }
  .nav-item svg{ width:17px; height:17px; flex:none; }
  .nav-item:hover{
    background:rgba(255, 255, 255, 0.14);
    color:#ffffff;
  }
  .nav-item.active{
    background:rgba(255, 255, 255, 0.22);
    color:#ffffff;
    font-weight:600;
    box-shadow:0 2px 8px rgba(0, 0, 0, 0.12);
  }
  .nav-item.active svg{
    color:var(--cyan-light);
  }

  /* KHỐI TÀI KHOẢN GÓC PHẢI (GỌN GÀNG, KHÔNG CÒN NÚT ĐĂNG XUẤT THÔ) */
  .top-right{
    display:flex;
    align-items:center;
    gap:12px;
    flex:none;
    position:relative;
  }
  .user-profile-pill{
    display:flex;
    align-items:center;
    gap:9px;
    background:rgba(255, 255, 255, 0.14);
    border:1px solid rgba(255, 255, 255, 0.22);
    padding:5px 12px 5px 10px;
    border-radius:100px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .user-profile-pill:hover{
    background:rgba(255, 255, 255, 0.22);
  }
  .user-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#10b981;
    box-shadow:0 0 0 2px rgba(16,185,129,0.3);
  }
  .user-name{
    font-size:12.8px;
    font-weight:600;
    color:#ffffff;
    white-space:nowrap;
  }
  .user-shop{
    font-size:11.5px;
    color:var(--cyan-light);
    border-left:1px solid rgba(255, 255, 255, 0.25);
    padding-left:8px;
    white-space:nowrap;
  }
  .user-avatar{
    width:26px;
    height:26px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--cyan-primary), var(--cyan-light));
    color:var(--blue-900);
    font-weight:700;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
  }

  /* USER DROPDOWN MENU */
  .user-dropdown{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    width:220px;
    background:var(--white);
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0, 50, 120, 0.18);
    border:1px solid var(--line);
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:200;
  }
  .user-dropdown.show{ display:flex; }
  .user-dropdown-header{
    padding:12px 14px;
    background:#f4faff;
    border-bottom:1px solid var(--line);
  }
  .user-dropdown-name{ font-size:13px; font-weight:700; color:var(--blue-900); }
  .user-dropdown-role{ font-size:11.5px; color:var(--blue-600); margin-top:2px; }
  .user-dropdown-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 14px;
    color:var(--ink-700);
    font-size:13px;
    font-weight:500;
    border:none;
    background:none;
    cursor:pointer;
    width:100%;
    text-align:left;
    transition:background .12s ease;
  }
  .user-dropdown-item:hover{ background:#f0f9ff; color:var(--blue-700); }
  .user-dropdown-item.logout{ color:var(--danger); border-top:1px solid #f1f5f9; }
  .user-dropdown-item.logout:hover{ background:#fef2f2; }
  .user-dropdown-item svg{ width:16px; height:16px; flex:none; }

  /* ============= PHẦN THÂN ỨNG DỤNG (TỐI ƯU TOÀN DIỆN TÍCH) ============= */
  .main-content{
    flex:1;
    display:flex;
    overflow:hidden;
    position:relative;
  }

  .page{ display:none; width:100%; height:100%; }
  .page.active{ display:flex; }

  /* ============= TRANG BÁN HÀNG: TẠI BÀN / MANG ĐI ============= */
  #page-banhang{
    display:none;
    width:100%;
    height:100%;
    overflow:hidden;
  }
  #page-banhang.active{ display:flex; }

  /* CATALOG PANEL (LƯỚI SẢN PHẨM RỘNG RÃI TOÀN BỘ PHÍA TRÁI) */
  .catalog-panel{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:14px 20px 16px;
    overflow:hidden;
    min-width:0;
  }

  /* THANH TÌM KIẾM VÀ CHIP CHẾ ĐỘ */
  .catalog-top-bar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
  }
  .mode-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#e6f7ff;
    border:1px solid #c8edff;
    color:var(--blue-800);
    padding:8px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    flex:none;
    box-shadow:0 1px 4px rgba(0, 119, 230, 0.06);
  }
  .mode-pill svg{ width:16px; height:16px; color:var(--blue-600); }

  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:9px 14px;
    flex:1;
    transition:all .15s ease;
  }
  .search-box:focus-within{
    border-color:var(--cyan-primary);
    box-shadow:0 0 0 3px rgba(51, 204, 255, 0.2);
  }
  .search-box svg{ flex:none; width:17px; height:17px; color:var(--blue-600); }
  .search-box input{
    border:none; outline:none; flex:1; font-size:13.5px; font-family:'Inter',sans-serif;
    background:transparent;
  }

  /* THANH CUỘN DANH MỤC */
  .cat-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:12px;
    margin-bottom:6px;
    scrollbar-width:thin;
  }
  .cat-tab{
    flex:none;
    padding:7px 16px;
    border-radius:100px;
    font-size:13px;
    font-weight:600;
    background:var(--white);
    border:1.5px solid var(--line);
    color:var(--ink-700);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s ease;
  }
  .cat-tab.active{
    background:var(--blue-600);
    border-color:var(--blue-600);
    color:#fff;
    box-shadow:0 3px 10px rgba(0, 119, 230, 0.22);
  }
  .cat-tab:hover:not(.active){
    border-color:var(--cyan-primary);
    color:var(--blue-700);
    background:#f0fbff;
  }

  /* LƯỚI SẢN PHẨM — HIỂN THỊ ĐƯỢC NHIỀU CỘT HƠN KHI BỎ SIDEBAR */
  .product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(148px, 1fr));
    gap:14px;
    overflow-y:auto;
    padding:4px 2px 20px;
    flex:1;
    align-content:start;
  }

  .prod-card{
    background:var(--white);
    border:1.5px solid #dce8f3;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    height:224px; /* Cố định chiều cao đồng đều 100% */
    box-shadow:0 2px 8px rgba(0, 80, 160, 0.04);
  }
  .prod-card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 22px rgba(0, 119, 230, 0.16);
    border-color:var(--cyan-primary);
  }

  .prod-img{
    position:relative;
    width:100%;
    height:136px;
    min-height:136px;
    max-height:136px;
    background:#f0faff;
    overflow:hidden;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .prod-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    transition:transform .2s ease;
  }
  .prod-card:hover .prod-img img{
    transform:scale(1.04);
  }

  .prod-ph{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--blue-600), var(--cyan-primary));
    color:#fff;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:22px;
  }
  .prod-price{
    position:absolute; left:6px; bottom:6px;
    background:rgba(2, 43, 89, 0.88);
    backdrop-filter:blur(4px);
    color:var(--cyan-light);
    font-size:11.5px; font-weight:700;
    padding:3px 8px; border-radius:6px;
    font-family:'Space Grotesk', sans-serif;
    letter-spacing:0.2px;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  .prod-info{
    padding:8px 10px 10px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    flex:1;
  }
  .prod-name{
    font-size:12.8px; font-weight:600; line-height:1.35;
    color:var(--ink-900);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    height:2.7em;
  }
  .prod-unit{ font-size:11px; color:var(--ink-400); margin-top:2px; }

  /* ============= CART PANEL (CỘT GIỎ HÀNG BÊN PHẢI) ============= */
  .cart-panel{
    width:380px;
    flex:none;
    background:var(--white);
    border-left:1.5px solid var(--line);
    display:flex;
    flex-direction:column;
    box-shadow:-2px 0 12px rgba(0, 80, 160, 0.04);
  }
  .cart-top{
    padding:14px 18px;
    border-bottom:1.5px solid var(--line);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .table-chip{
    display:flex; align-items:center; gap:6px;
    background:#e6f7ff; color:var(--blue-800);
    font-weight:700; font-size:13px;
    padding:7px 14px; border-radius:8px;
    cursor:pointer; border:1px solid #c8edff;
    font-family:'Inter', sans-serif;
  }
  .table-chip svg{ width:15px; height:15px; color:var(--blue-600); }
  .cust-search{
    flex:1; min-width:120px;
    display:flex; align-items:center; gap:6px;
    border:1.5px solid var(--line); border-radius:8px;
    padding:7px 10px;
  }
  .cust-search:focus-within{ border-color:var(--cyan-primary); }
  .cust-search svg{ width:15px; height:15px; color:var(--blue-600); flex:none; }
  .cust-search input{ border:none; outline:none; flex:1; font-size:12.5px; background:transparent; }

  .cart-list{
    flex:1; overflow-y:auto;
    padding:8px 14px;
  }
  .cart-empty{
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:var(--ink-400); text-align:center; padding:30px;
  }
  .cart-empty svg{ width:46px; height:46px; color:#b5e2fa; }
  .cart-empty p{ font-size:13px; max-width:22ch; }

  .cart-line{
    display:flex; gap:10px; align-items:flex-start;
    padding:10px 0;
    border-bottom:1px solid #edf4fa;
  }
  .cart-thumb{
    width:46px; height:46px; border-radius:8px; flex:none; overflow:hidden;
    background:#f0f9ff; border:1px solid #dce8f3;
  }
  .cart-thumb img{ width:100%; height:100%; object-fit:cover; }
  .cart-thumb .ph{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--blue-600), var(--cyan-primary));
    color:#fff; font-size:13px; font-weight:700; font-family:'Space Grotesk',sans-serif;
  }
  .cart-mid{ flex:1; min-width:0; }
  .cart-mid .cn{ font-size:12.8px; font-weight:600; line-height:1.3; color:var(--ink-900); }
  .cart-mid .cp{ font-size:11.8px; color:var(--blue-700); font-weight:600; margin:2px 0 4px; }
  .qty-stepper{
    display:inline-flex; align-items:center;
    border:1px solid var(--line); border-radius:6px; overflow:hidden;
  }
  .qty-stepper button{
    border:none; background:#f4faff; width:22px; height:22px;
    cursor:pointer; font-weight:700; font-size:13px; color:var(--blue-800);
  }
  .qty-stepper button:hover{ background:#e0f3ff; }
  .qty-stepper .q{ width:26px; text-align:center; font-size:12px; font-weight:600; }

  .cart-right{
    display:flex; flex-direction:column; align-items:flex-end; gap:6px;
  }
  .cart-right .lt{ font-size:12.8px; font-weight:700; color:var(--blue-900); font-family:'Space Grotesk',sans-serif; }
  .rm-btn{
    background:none; border:none; cursor:pointer; color:var(--ink-400); padding:2px;
  }
  .rm-btn:hover{ color:var(--danger); }
  .rm-btn svg{ width:14px; height:14px; }

  /* CART SUMMARY & ACTIONS */
  .cart-summary{
    padding:12px 18px 16px;
    border-top:1.5px solid var(--line);
    background:#ffffff;
  }
  .sum-row{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; color:var(--ink-600); margin-bottom:6px;
  }
  .sum-row .mini{
    width:64px; text-align:right; border:1px solid var(--line); border-radius:6px;
    padding:4px 6px; font-size:12.5px; font-family:'Inter',sans-serif;
  }
  .sum-total{
    display:flex; align-items:center; justify-content:space-between;
    background:#e8f8ff;
    border:1px solid #c8edff;
    border-radius:10px;
    padding:11px 14px;
    margin:10px 0 12px;
    font-weight:700;
  }
  .sum-total .label{ font-size:13px; color:var(--blue-800); }
  .sum-total .value{ font-family:'Space Grotesk',sans-serif; font-size:19px; color:var(--blue-900); }

  .note-input{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font-size:12.5px; font-family:'Inter',sans-serif;
    margin-bottom:12px; outline:none;
  }
  .note-input:focus{ border-color:var(--cyan-primary); }

  .action-row{ display:flex; gap:8px; }
  .btn-outline{
    flex:1; border:1.5px solid var(--line); background:var(--white);
    border-radius:8px; padding:11px; font-size:13px; font-weight:600;
    color:var(--ink-700); cursor:pointer; font-family:'Inter',sans-serif;
    transition:all .15s ease;
  }
  .btn-outline:hover{ border-color:var(--blue-500); color:var(--blue-700); background:#f4faff; }
  .btn-pay{
    flex:2; border:none;
    background:linear-gradient(135deg, #0077e6 0%, #0099ff 100%);
    border-radius:8px; padding:11px; font-size:14px; font-weight:700;
    color:var(--white); cursor:pointer; font-family:'Inter',sans-serif;
    box-shadow:0 4px 12px rgba(0, 119, 230, 0.3);
    transition:all .15s ease;
  }
  .btn-pay:hover{
    background:linear-gradient(135deg, #0066cc 0%, #0088ee 100%);
    box-shadow:0 6px 16px rgba(0, 119, 230, 0.4);
  }

  /* ============= PLACEHOLDER PAGES ============= */
  .placeholder-page{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    color:var(--ink-400);
    padding:40px;
    background:#ffffff;
  }
  .placeholder-page .ph-icon{
    width:68px; height:68px;
    border-radius:20px;
    background:#e6f7ff;
    display:flex; align-items:center; justify-content:center;
  }
  .placeholder-page .ph-icon svg{ width:34px; height:34px; color:var(--blue-600); }
  .placeholder-page strong{ color:var(--blue-900); font-size:18px; font-family:'Space Grotesk', sans-serif; }
  .placeholder-page p{ font-size:14px; max-width:40ch; text-align:center; line-height:1.6; }

  /* ============= RESPONSIVE ============= */
  @media (max-width: 992px){
    .user-shop{ display:none; }
    #page-banhang{ flex-direction:column; }
    .cart-panel{
      width:100%; max-height:46vh;
      border-left:none; border-top:1.5px solid var(--line);
    }
    .catalog-panel{ max-height:54vh; }
  }

  @media (max-width: 680px){
    .topbar{ padding:0 12px; }
    .top-brand-text{ display:none; }
    .nav-item span{ display:none; }
    .nav-item{ padding:8px 10px; }
    .mode-pill span{ display:none; }
  }
</style>
</head>
<body>

  <!-- ============ THANH ĐIỀU HƯỚNG NGANG TRÊN CÙNG ============ -->
  <header class="topbar">
    <div class="top-left">
      <!-- LOGO -->
      <div class="top-brand" onclick="switchPage('banhang')">
        <div class="top-logo">
          <svg viewBox="0 0 24 24"><path d="M13 2L3 14h8l-2 8 11-13h-8l3-7z"/></svg>
        </div>
        <span class="top-brand-text">GOAN POS</span>
      </div>

      <!-- THANH MENU ĐIỀU HƯỚNG NGANG -->
      <ul class="top-nav" id="topNav"></ul>
    </div>

    <!-- KHỐI TÀI KHOẢN (GỌN GÀNG, KHÔNG CÓ NÚT ĐĂNG XUẤT THÔ) -->
    <div class="top-right">
      <div class="user-profile-pill" id="userProfileBtn" title="Tài khoản thu ngân">
        <span class="user-dot"></span>
        <span class="user-name" id="topUserName">Chủ quán Demo</span>
        <span class="user-shop" id="topUserShop">GOAN Coffee & Tea</span>
        <div class="user-avatar" id="topAvatar">D</div>
      </div>

      <!-- DROPDOWN TÀI KHOẢN KHI BẤM VÀO -->
      <div class="user-dropdown" id="userDropdown">
        <div class="user-dropdown-header">
          <div class="user-dropdown-name" id="dropdownUserName">Chủ quán Demo</div>
          <div class="user-dropdown-role" id="dropdownUserRole">Quản lý cửa hàng</div>
        </div>
        <button class="user-dropdown-item logout" onclick="handleLogout()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Đăng xuất tài khoản</span>
        </button>
      </div>
    </div>
  </header>

let activeNav = 'banhang';

function renderTopNav(){
  const ul = document.getElementById('topNav');
  ul.innerHTML = NAV_ITEMS.map(item => `

      ${ICONS[item.key]}
      <span>${item.label}</span>
    </li>
  `).join('');

  ul.querySelectorAll('.nav-item').forEach(li => {
    li.addEventListener('click', () => switchPage(li.dataset.key));
  });
}

function switchPage(key){
  activeNav = key;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const targetPage = document.getElementById('page-' + key);
  if(targetPage) targetPage.classList.add('active');
  renderTopNav();

  if(key !== 'banhang' && !targetPage.dataset.built){
    buildPlaceholder(key);
  }
}

function buildPlaceholder(key){
  const [title, desc] = PLACEHOLDER_TEXT[key];
  const page = document.getElementById('page-' + key);
  page.dataset.built = '1';
  page.innerHTML = `
    <div class="placeholder-page">
      <div class="ph-icon">${ICONS[key]}</div>
      <strong>${title}</strong>
      <p>${desc} Tính năng này đang được kết nối trong phiên bản tiếp theo.</p>
    </div>`;
}

const CATEGORIES = ['Tất cả', 'Cà Phê Năng Lượng', 'Thanh Nhiệt', 'Nước Ép Trái Cây Tươi', 'Thức Uống Khác', 'Thức Ăn'];

const state = {
  activeCat: 'Tất cả',
  search: '',
  cart: [] // {code, name, price, unit, img, qty}
};

function fmtVND(n){ return n.toLocaleString('vi-VN') + 'đ'; }
function initials(name){
  return name.trim().split(/\s+/).slice(0,1)[0].slice(0,2).toUpperCase();
}

function renderCatTabs(){
  const el = document.getElementById('catTabs');
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="cat-tab${state.activeCat === c ? ' active' : ''}" data-cat="${c}">${c}</button>`
  ).join('');

  el.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeCat = btn.dataset.cat;
      renderCatTabs();
      renderGrid();
    });
  });
}

function renderGrid(){
  const el = document.getElementById('productGrid');
  const cat = state.activeCat;
  const q = state.search.trim().toLowerCase();
  const list = PRODUCTS.filter(p =>
    (cat === 'Tất cả' || p.cat === cat) &&
    (q === '' || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q))
  );

  el.innerHTML = list.map(p => `
    <div class="prod-card" data-code="${p.code}">
      <div class="prod-img">
        ${p.img 
          ? `<img src="assets/products/${p.img}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'prod-ph\\'>${initials(p.name)}</div><span class=\\'prod-price\\'>${fmtVND(p.price)}</span>';">` 
          : `<div class="prod-ph">${initials(p.name)}</div>`
        }
        <span class="prod-price">${fmtVND(p.price)}</span>
      </div>
      <div class="prod-info">
        <div class="prod-name" title="${p.name}">${p.name}</div>
        <div class="prod-unit">${p.unit}</div>
      </div>
    </div>`).join('') || `<div style="grid-column:1/-1; text-align:center; color:var(--ink-400); padding:50px 0; font-size:14px;">Không tìm thấy sản phẩm phù hợp.</div>`;

  el.querySelectorAll('.prod-card').forEach(card => {
    card.addEventListener('click', () => addToCart(card.dataset.code));
  });
}

function addToCart(code){
  const p = PRODUCTS.find(x => x.code === code);
  const line = state.cart.find(x => x.code === code);
  if(line){ line.qty += 1; } else { state.cart.push({...p, qty:1}); }
  renderCart();
}

function changeQty(code, delta){
  const line = state.cart.find(x => x.code === code);
  if(!line) return;
  line.qty += delta;
  if(line.qty <= 0){ state.cart = state.cart.filter(x => x.code !== code); }
  renderCart();
}

function removeLine(code){
  state.cart = state.cart.filter(x => x.code !== code);
  renderCart();
}

function renderCart(){
  const listEl = document.getElementById('cartList');
  const totalEl = document.getElementById('cartTotal');
  const total = state.cart.reduce((s, l) => s + l.price * l.qty, 0);
  totalEl.textContent = fmtVND(total);

  if(state.cart.length === 0){
    listEl.innerHTML = `
      <div class="cart-empty">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 8H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="21" r="1.3" fill="currentColor"/><circle cx="18" cy="21" r="1.3" fill="currentColor"/></svg>
        <p>Chưa có món nào. Chọn sản phẩm bên cạnh để thêm vào đơn hàng.</p>
      </div>`;
    return;
  }

  listEl.innerHTML = state.cart.map(l => `
    <div class="cart-line" data-code="${l.code}">
      <div class="cart-thumb">
        ${l.img 
          ? `<img src="assets/products/${l.img}" alt="" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\\'ph\\'>${initials(l.name)}</div>';">` 
          : `<div class="ph">${initials(l.name)}</div>`
        }
      </div>
      <div class="cart-mid">
        <div class="cn">${l.name}</div>
        <div class="cp">${fmtVND(l.price)} / ${l.unit}</div>
        <div class="qty-stepper">
          <button data-act="dec">−</button>
          <span class="q">${l.qty}</span>
          <button data-act="inc">+</button>
        </div>
      </div>
      <div class="cart-right">
        <span class="lt">${fmtVND(l.price * l.qty)}</span>
        <button class="rm-btn" data-act="rm"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
    </div>`).join('');

  listEl.querySelectorAll('.cart-line').forEach(row => {
    const code = row.dataset.code;
    row.querySelector('[data-act="inc"]').addEventListener('click', () => changeQty(code, 1));
    row.querySelector('[data-act="dec"]').addEventListener('click', () => changeQty(code, -1));
    row.querySelector('[data-act="rm"]').addEventListener('click', () => removeLine(code));
  });
}

document.getElementById('prodSearchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  renderGrid();
});

renderCatTabs();
renderGrid();
renderCart();

function initUserSession(){
  let user = null;
  try {
    const raw = localStorage.getItem('goan_user');
    if(raw) user = JSON.parse(raw);
  } catch(e){}

  if(!user){
    user = {
      email: 'demo@goan.vn',
      name: 'Chủ quán Demo',
      role: 'Quản lý cửa hàng',
      shop: 'GOAN Coffee & Tea'
    };
    try {
      localStorage.setItem('goan_user', JSON.stringify(user));
    } catch(e){}
  }

  const topName = document.getElementById('topUserName');
  const topShop = document.getElementById('topUserShop');
  const topAvatar = document.getElementById('topAvatar');
  const dropdownName = document.getElementById('dropdownUserName');
  const dropdownRole = document.getElementById('dropdownUserRole');

  if(topName) topName.textContent = user.name || 'Chủ quán Demo';
  if(topShop) topShop.textContent = user.shop || 'GOAN Coffee & Tea';
  if(dropdownName) dropdownName.textContent = user.name || 'Chủ quán Demo';
  if(dropdownRole) dropdownRole.textContent = user.role || 'Quản lý cửa hàng';
  if(topAvatar){
    const initial = (user.name || 'D').trim().charAt(0).toUpperCase();
    topAvatar.textContent = initial;
  }
}

// Bật/tắt dropdown khi click profile pill
const userProfileBtn = document.getElementById('userProfileBtn');
const userDropdown = document.getElementById('userDropdown');

if(userProfileBtn && userDropdown){
  userProfileBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    userDropdown.classList.toggle('show');
  });

  document.addEventListener('click', () => {
    userDropdown.classList.remove('show');
  });

  userDropdown.addEventListener('click', (e) => {
    e.stopPropagation();
  });
}

function handleLogout(){
  if(confirm('Bạn có chắc chắn muốn đăng xuất khỏi hệ thống GOAN POS?')){
    try {
      localStorage.removeItem('goan_user');
    } catch(e){}
    window.location.href = 'index.html?logout=true';
  }
}

initUserSession();
